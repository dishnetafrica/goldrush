# GoldInvest staging virtual host. Document root = project root (vendor layout: root index.php + root .htaccess,
# assets referenced as /public/...). TLS is terminated by the EasyPanel proxy; Apache listens on port 80 only.
ServerTokens Prod
ServerSignature Off

<VirtualHost *:80>
    # ServerName does not need to match the public domain: the proxy routes by host and Laravel builds links from APP_URL.
    ServerName goldinvest-staging.local
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # --- Never serve framework internals from the project root ---
    RedirectMatch 404 ^/(\.env[^/]*|\.git|storage|vendor|app|bootstrap|config|database|resources|routes|tests|lang|node_modules)(/|$)
    RedirectMatch 404 ^/(composer\.(json|lock)|package\.json|artisan|symlink\.php|phpunit\.xml|vite\.config\.js|README\.md|\.editorconfig|\.gitattributes|\.gitignore|\.htaccess)$

    # --- Staging-only blocks (audit findings S2 and S4) ---
    # Installer and its unauthenticated reset route
    RedirectMatch 404 ^/project/install(/|$)
    # Unauthenticated file uploader / remover (also used by admin image forms; see runbook 1.2 for the IP-allowlist alternative)
    RedirectMatch 404 ^/fileholder-(upload|remove)$

    # --- No script execution inside upload directories ---
    <DirectoryMatch "^/var/www/html/public/(fileholder|backend/files|backend/images|frontend/images|frontend/user)/">
        php_flag engine off
        <FilesMatch "\.(php|phtml|phar|pl|py|cgi|sh|htaccess)$">
            Require all denied
        </FilesMatch>
    </DirectoryMatch>

    # --- Optional: restrict the whole staging site to reviewers if EasyPanel Basic Auth is not available ---
    # <Location />
    #     Require ip 203.0.113.10 198.51.100.0/24
    # </Location>

    Header always set X-Content-Type-Options "nosniff"
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"

    ErrorLog /dev/stderr
    CustomLog /dev/stdout combined
</VirtualHost>
