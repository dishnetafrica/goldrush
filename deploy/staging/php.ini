; GoldInvest staging PHP overrides
upload_max_filesize = 12M
post_max_size = 16M
max_execution_time = 120
max_input_time = 120
; memory_limit is overridden to -1 at runtime by app/Providers/AppServiceProvider.php; this is the CLI/default value
memory_limit = 512M
expose_php = Off
display_errors = Off
log_errors = On
date.timezone = UTC
opcache.enable = 1
opcache.validate_timestamps = 1
session.cookie_httponly = 1
